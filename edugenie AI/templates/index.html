<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - Learning Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>EduGenie</h1>

        <p>Google Gemini Powered Learning Assistant</p>

        <div class="card">

            <label for="task">Select Task</label>

            <select id="task">
                <option value="qa">Question & Answer</option>
                <option value="explain">Explain a Concept</option>
                <option value="summarize">Summarize</option>
                <option value="quiz">Generate Quiz</option>
                <option value="learn">Learning Recommendation</option>
            </select>

            <label for="inputText">Enter your topic or question</label>

            <textarea
                id="inputText"
                placeholder="Type your question or topic here..."
            ></textarea>

            <button onclick="submitTask()">
                Generate
            </button>

            <div id="result"></div>

        </div>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
